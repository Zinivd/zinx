<div class="back-button-div mb-3">
    <button (click)="goBack()" class="back-btn">← Back</button>
</div>

<div class="body-head mb-3">
    <h4 class="mb-0">{{ isEditMode ? 'Edit Task' : 'Add Task' }}</h4>
</div>

<form (ngSubmit)="onSubmit()">
    <div class="form-div">
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="taskname">Task Name <span>*</span></label>
                <input type="text" class="form-control" id="taskname" name="taskname" [(ngModel)]="task.name"
                    placeholder="Enter Task Name" required>
            </div>
            <div class="col-md-4 mb-3">
                <label for="project">Project Name <span>*</span></label>
                <select class="form-select" id="project" name="project" [(ngModel)]="task.project" required>
                    <option value="" disabled>Select Project</option>
                    <option value="1">Project Alpha</option>
                    <option value="2">Project Beta</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label>Assign Employee <span>*</span></label>
                <div class="custom-multiselect" [class.open]="dropdownOpen">
                    <div class="multiselect-trigger form-control" (click)="toggleDropdown()">
                        <span class="trigger-label" [class.placeholder]="task.employees.length === 0">
                            {{ selectedEmployeeLabel }}
                        </span>
                        <i class="fa-solid fa-angle-down multiselect-arrow"></i>
                    </div>
                    <div class="selected-tags" *ngIf="task.employees.length > 0">
                        <span class="tag" *ngFor="let id of task.employees">
                            {{ getEmployeeName(id) }}
                            <button type="button" class="tag-remove" (click)="removeEmployee(id, $event)">×</button>
                        </span>
                    </div>
                    <!-- Dropdown -->
                    <div class="multiselect-panel" *ngIf="dropdownOpen">
                        <!-- Search -->
                        <div class="multiselect-search-wrap">
                            <i class="bx bx-search multiselect-search-icon"></i>
                            <input type="text" class="multiselect-search" placeholder="Search employee..."
                                [(ngModel)]="employeeSearch" name="employeeSearch" (click)="$event.stopPropagation()" />
                        </div>
                        <!-- Select All -->
                        <div class="multiselect-option select-all-option" (click)="toggleSelectAll()">
                            <input type="checkbox" class="multiselect-checkbox" [checked]="allSelected"
                                [indeterminate]="someSelected" (click)="$event.stopPropagation()"
                                (change)="toggleSelectAll()" />
                            <span class="option-label">Select All</span>
                        </div>
                        <div class="multiselect-divider"></div>
                        <!-- Employee Options -->
                        <div class="multiselect-option" *ngFor="let emp of filteredEmployees"
                            (click)="toggleEmployee(emp.id)">
                            <input type="checkbox" class="multiselect-checkbox" [checked]="isSelected(emp.id)"
                                (click)="$event.stopPropagation()" (change)="toggleEmployee(emp.id)" />
                            <span class="option-label">{{ emp.name }}</span>
                        </div>
                        <!-- No results -->
                        <div class="multiselect-empty" *ngIf="filteredEmployees.length === 0">
                            No employees found.
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <label for="startdate">Start Date <span>*</span></label>
                <input type="date" class="form-control" id="startdate" name="startdate" [(ngModel)]="task.startdate"
                    required>
            </div>
            <div class="col-md-4 mb-3">
                <label for="enddate">End Date <span>*</span></label>
                <input type="date" class="form-control" id="enddate" name="enddate" [(ngModel)]="task.enddate" required>
            </div>
            <div class="col-md-4 mb-3">
                <label for="status">Status <span>*</span></label>
                <select class="form-select" id="status" name="status" [(ngModel)]="task.status" required>
                    <option value="" disabled>Select Status</option>
                    <option value="Opened">Opened</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>
            <div class="col-md-8 mb-3">
                <label for="description">Description <span>*</span></label>
                <textarea class="form-control" rows="2" id="description" name="description"
                    [(ngModel)]="task.description" required></textarea>
            </div>
        </div>
    </div>

    <div class="form-btn-div mt-4">
        <button type="submit" class="form-btn">
            {{ isEditMode ? 'Update Task' : 'Add Task' }}
        </button>
    </div>
</form>
