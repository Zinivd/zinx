<div class="back-button-div mb-3">
    <button (click)="goBack()" class="back-btn">← Back</button>
</div>

<div class="body-head mb-3">
    <h4 class="mb-0">{{ isEditMode ? 'Edit Project' : 'Add Project' }}</h4>
</div>

<form (ngSubmit)="onSubmit()">
    <div class="form-div">
        <div class="row">

            <div class="col-md-4 mb-3">
                <label for="projectname">Project Name <span>*</span></label>
                <input type="text" class="form-control" id="projectname" name="projectname" [(ngModel)]="project.name"
                    placeholder="Enter Project Name" required>
            </div>

            <div class="col-md-4 mb-3">
                <label for="clientname">Client Name <span>*</span></label>
                <input type="text" class="form-control" id="clientname" name="clientname"
                    [(ngModel)]="project.client_name" placeholder="Enter Client Name" required>
            </div>

            <div class="col-md-4 mb-3">
                <label for="email">Email ID</label>
                <input type="email" class="form-control" id="email" name="email" [(ngModel)]="project.email"
                    placeholder="Enter Email">
            </div>

            <div class="col-md-4 mb-3">
                <label for="contact">Contact Number <span>*</span></label>
                <div class="input-double-flex">
                    <label class="mb-0 text-center">+ 91</label>
                    <input type="tel" class="form-control border-0" id="contact" name="contact" pattern="[6-9][0-9]{9}"
                        maxlength="10" [(ngModel)]="project.contact" placeholder="Enter Contact Number"
                        (input)="validateContact($event)" required>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <label for="address">Address <span>*</span></label>
                <input type="text" class="form-control" id="address" name="address" [(ngModel)]="project.address"
                    placeholder="Enter Address" required>
            </div>

            <div class="col-md-4 mb-3">
                <label for="gstno">GST Number <span>*</span></label>
                <input type="text" class="form-control text-uppercase" id="gstno" name="gstno" maxlength="15"
                    [(ngModel)]="project.gst_no" placeholder="Enter GST Number" (input)="validateGST($event)" required>
            </div>

            <div class="col-md-4 mb-3">
                <label for="quotation">Quotation <span>*</span></label>
                <input type="number" class="form-control" id="quotation" name="quotation" min="0"
                    [(ngModel)]="project.quotation" placeholder="Enter Quotation" required>
            </div>

            <div class="col-md-4 mb-3">
                <label for="type">Type <span>*</span></label>
                <select class="form-select" id="type" name="type" [(ngModel)]="project.type" required>
                    <option value="" disabled>Select Type</option>
                    <option value="Fixed">Fixed</option>
                    <option value="Percentage">Percentage</option>
                    <option value="Time and Materials">Time and Materials</option>
                </select>
            </div>

            <div class="col-md-4 mb-3">
                <label for="deadline">Deadline <span>*</span></label>
                <input type="date" class="form-control" id="deadline" name="deadline" [(ngModel)]="project.deadline"
                    required>
            </div>

        </div>
    </div>

    <div class="form-btn-div mt-4">
        <button type="submit" class="form-btn" [disabled]="isSubmitting">

            {{ isSubmitting ? 'Please Wait...' : (isEditMode ? 'Update Project' : 'Add Project') }}

        </button>
    </div>
</form>
