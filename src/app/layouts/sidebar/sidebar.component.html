<aside>
    <div class="flex-shrink-0 sidebar">
        <div class="nav col-md-12">
            <a routerLink="/dashboard" class="mx-auto">
                <img src="assets/images/Logo.png" alt="" height="50px" class="mx-auto" />
            </a>
        </div>

        <ul class="main-ul list-unstyled ps-0">
            <!-- Dashboard -->
            <li class="mb-3">
                <button class="aside-btn mx-auto" routerLink="/dashboard" routerLinkActive="asidebtn-active">
                    <div class="btn-name">
                        <i class="bx bx-dashboard"></i> Dashboard
                    </div>
                </button>
            </li>
            <!-- Employee -->
            <li class="mb-3">
                <button class="aside-btn mx-auto" routerLink="/employee-list" routerLinkActive="asidebtn-active">
                    <div class="btn-name">
                        <i class="bx bx-user"></i> Employees
                    </div>
                </button>
            </li>
            <!-- Projects -->
            <li class="mb-3">
                <button class="aside-btn mx-auto" routerLink="/projects" routerLinkActive="asidebtn-active">
                    <div class="btn-name">
                        <i class="bx bx-layers-down-right"></i> Projects
                    </div>
                </button>
            </li>
            <!-- Task -->
            <li class="mb-3">
                <button class="aside-btn mx-auto" routerLink="/tasks" routerLinkActive="asidebtn-active">
                    <div class="btn-name">
                        <i class="bx bx-checklist"></i> Tasks
                    </div>
                </button>
            </li>
            <!-- Finance -->
            <li class="mb-3">
                <button class="aside-btn mx-auto" [class.asidebtn-active]="openMenu['finance']"
                    (click)="toggleMenu('finance')">
                    <div class="btn-name">
                        <i class="bx bx-wallet"></i> Finance
                    </div>
                    <div class="right-icon d-flex ms-auto">
                        <i class="fa-solid toggle-icon" [ngClass]="{
                            'fa-angle-down': openMenu['finance'],
                            'fa-angle-right': !openMenu['finance']
                        }"></i>
                    </div>
                </button>
                <div class="collapse" [class.show]="openMenu['finance']">
                    <ul class="btn-toggle-nav ms-2 ps-5 pb-3">
                        <li class="mt-3">
                            <a routerLink="/cashback" routerLinkActive="aside-link-active" class="nav-link">
                                Cashback
                            </a>
                        </li>
                        <li>
                            <a routerLink="/invoice" routerLinkActive="aside-link-active" class="nav-link">
                                Invoice
                            </a>
                        </li>
                    </ul>
                </div>
            </li>
            <!-- Settings -->
            <li class="mb-3">
                <button class="aside-btn mx-auto" routerLink="/settings" routerLinkActive="asidebtn-active">
                    <div class="btn-name">
                        <i class="bx bx-cog"></i> Settings
                    </div>
                </button>
            </li>

            <!-- Logout -->
            <li class="mb-3">
                <button class="aside-btn mx-auto">
                    <div class="btn-name">
                        <i class="bx bxs-arrow-out-right-square-half"></i> Logout
                    </div>
                </button>
            </li>
        </ul>
    </div>
</aside>
